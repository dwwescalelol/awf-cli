openawf: 0.1.0
name: feat-dev
summary: Plan, review and ship a feature.
model: anthropic/claude-opus-5
effort: medium
metadata:
  tags:
    - dev
  authors:
    - Ada
  icon: ./icon.svg
  zeta: null
  alpha: []
license: Apache-2.0
version: 0.2.0
sha: null
external-version: n8n-41
start: plan
orchestration:
  plan: review
  review:
    fail:
      task: plan
      retries: 2
      session: resume
      x-runner:
        note: replan
    ok: ship
  ship: null
tasks:
  plan:
    summary: Plan the change.
    body: |
      # plan
    x-runner:
      cwd: .
  review:
    external-version: rev-7
    metadata:
      tags:
        - review
    license: MIT
    model:
      - anthropic/claude-sonnet-5
      - openai/gpt-6
    effort: high
    max-turns: 10
    timeout: 600000
    outcomes:
      ok:
        type: object
      fail:
        properties:
          reason:
            type: string
        required:
          - reason
        type: object
    uses:
      - fs
      - gh
    system: |
      You review changes.
      You never edit files.
    body: |
      # review
    x-zed: {}
    x-alpha: null
  ship:
    $ref: ./ship.md
mcp:
  fs:
    type: stdio
    allow: "*"
    command: mcp-fs
    x-runner:
      cwd: /tmp
  gh:
    type: http
    allow:
      - create_pr
      - list_issues
    url: https://example.com/mcp
  none:
    type: stdio
    deny:
      - delete_file
    command: mcp-none
x-runner:
  mode: plan
  b: 1
  a: 2
x-claude:
  permission-mode: plan
