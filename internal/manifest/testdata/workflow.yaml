openawf: 0.1.0
name: feat-dev
summary: Plan, review and ship a feature.
model: anthropic/claude-opus-5
effort: medium
metadata:
  tags:
    - dev
  authors:
    - Ada
  icon: ./icon.svg
  zeta: null
  alpha: []
license: Apache-2.0
version: 0.2.0
sha: null
external-version: n8n-41
start: plan
orchestration:
  plan: review
  review:
    fail:
      task: plan
      retries: 2
      session: resume
      x-runner:
        note: replan
    ok: ship
  ship: null
tasks:
  plan:
    summary: Plan the change.
    body: |
      # plan
    x-runner:
      cwd: .
  review:
    external-version: rev-7
    metadata:
      tags:
        - review
    license: MIT
    model:
      - anthropic/claude-sonnet-5
      - openai/gpt-6
    effort: high
    max-turns: 10
    timeout: 600000
    outcomes:
      ok:
        type: object
      fail:
        properties:
          reason:
            type: string
        required:
          - reason
        type: object
    uses:
      - fs
      - gh
    system: |
      You review changes.
      You never edit files.
    body: |
      # review
    x-zed: {}
    x-alpha: null
  ship:
    $ref: ./ship.md
mcp:
  fs:
    type: stdio
    command: mcp-fs
    allow: "*"
    x-runner:
      cwd: /tmp
  gh:
    type: http
    url: https://example.com/mcp
    headers:
      X-Trace: "on"
      Authorization: Bearer ${GITHUB_TOKEN}
    oauth:
      client-id: awf
      scopes:
        - repo
      callback-port: 8080
      metadata-url: https://example.com/.well-known/oauth-authorization-server
    allow:
      - create_pr
      - list_issues
    timeout: 60000
  none:
    type: stdio
    command: mcp-none
    deny:
      - delete_file
  pkg:
    type: stdio
    package:
      registry-type: mcpb
      identifier: https://example.com/server.mcpb
      version: 1.2.3
      file-sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    args:
      - ${REPO_DIR}
    env:
      ZED: "1"
      ALPHA: "2"
    x-zed: 1
    x-alpha: 2
x-runner:
  mode: plan
  b: 1
  a: 2
x-claude:
  permission-mode: plan
